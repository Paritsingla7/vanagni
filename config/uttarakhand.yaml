# Vanagni: Uttarakhand v1 config (region-specific settings; shared defaults are in
# defaults.yaml). See docs/EXECUTION_PLAN.md Phase 0.2.

region:
  name: uttarakhand
  state_id: UK
  # Projected CRS for the 5 km lattice (UTM 44N covers the whole state). If
  # omitted, the UTM zone of the bbox centre is used.
  crs: EPSG:32644
  # Padded bounding box (actual state extent: ~28.71N-31.28N, 77.57E-81.03E)
  bbox:
    north: 31.5
    south: 28.6
    west: 77.5
    east: 81.1

paths:
  # Uttarakhand keeps its original data layout. A new region omits this block
  # and gets data/<region>/raw and data/<region>/processed automatically.
  raw: data/raw
  processed: data/processed

season:
  # FR-2.4: the days-since-onset anchor lives in this per-district table
  # (single source of truth -- currently a state-wide Feb 15-Jun 15 window
  # on every row, see docs/RISKS.md §4), joined onto cells by district.
  calendar_csv: config/fire_calendar_uttarakhand.csv

weather:
  # Download these calendar months first (the Feb 15 - Jun 15 fire season
  # feeds training and evaluation; other months only fill the weather file).
  priority_months: [2, 3, 4, 5, 6]

static_layers:
  osm:
    # State-level extract from openstreetmap.fr (~33 MB vs Geofabrik's 335 MB
    # central-zone file, same data). Clipped at the state border, so roads just
    # across it (UP/Himachal/Nepal) are absent: distances in border cells are
    # upper bounds -- a named limitation, not a bug.
    pbf_url: https://download.openstreetmap.fr/extracts/asia/india/uttarakhand-latest.osm.pbf
    state_name: Uttarakhand  # admin_level=4 boundary the grid is clipped to
