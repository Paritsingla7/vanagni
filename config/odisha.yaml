# Vanagni: Odisha config -- the second-region proof. Only region-specific settings live
# here; everything else comes from defaults.yaml, and data goes to data/odisha/ (no paths
# block), so nothing of Uttarakhand's can be overwritten.
#
# SEASON: Nov 1 - Jun 30 wraps the new year (start doy 305 > end doy 181). The panel,
# folds and in_season test handle that; a test season is labelled by the year it ends in
# (test season 2022 = Nov 2021 - Jun 2022).

region:
  name: odisha
  state_id: OD
  # Spans 81.4-87.5 E: wider than one 6-degree UTM zone, so cell areas under UTM would
  # vary by up to ~1%. Asia South Albers is equal-area: a projected 5 km cell is exactly
  # 25 km2 everywhere.
  crs: ESRI:102028
  # Padded bounding box (actual state extent: ~17.78N-22.57N, 81.38E-87.53E)
  bbox:
    north: 22.7
    south: 17.7
    west: 81.3
    east: 87.6
  # Shown on the methodology page after the limits every region shares.
  known_limitations:
    - "The fire calendar is one provisional state-wide window (Nov 1 - Jun 30, from the Forest Survey of India alert season); no district-level source was found."
    - "Four test seasons (2021-2024): the ERA5-Land download covers January 2017 to June 2024."
    - "Dry deciduous and sal forest are not separated in the land-cover layer, and much of the state's fire is in shifting-cultivation areas that WorldCover may map as shrub or cropland."

season:
  calendar_csv: config/fire_calendar_odisha.csv

weather:
  # Fire-season months first (see the gap noted above).
  priority_months: [11, 12, 1, 2, 3, 4, 5, 6]

static_layers:
  osm:
    pbf_url: https://download.openstreetmap.fr/extracts/asia/india/odisha-latest.osm.pbf
    state_name: Odisha  # admin_level=4 boundary the grid is clipped to

fwi:
  # Restart the moisture codes on Oct 1, after the monsoon has saturated the ground (the
  # standard startup values assume a wet start) and a month before the Nov 1 season opens.
  # The default Jan 1 would reset them in the middle of Odisha's season.
  restart: [10, 1]
